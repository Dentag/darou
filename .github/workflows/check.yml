name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check tracked files for credentials
        run: python3 scripts/check_secrets.py --tracked
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Test and build server
        run: ./gradlew :server:test :server:installDist --console=plain
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Build and lint Android app
        run: ./gradlew :androidApp:assembleDebug :androidApp:lintDebug --console=plain
      - name: Install browser test dependencies
        run: npm ci --prefix tests/browser
      - name: Install Chromium
        run: npx --prefix tests/browser playwright install --with-deps chromium
      - name: Verify calls and reconnection
        run: node tests/browser/e2e.cjs
        env:
          TEST_RECOVERY: '1'
